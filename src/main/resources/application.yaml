server:
  port: 8083
spring:
  application:
    name: realtime-gateway
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
alamano:
  security:
    jwt-public-key: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}
  gateway:
    instance-id: ${HOSTNAME:local}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost,http://localhost:5173}
    dedup-capacity: 10000
    location-min-interval-ms: 2000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${alamano.gateway.instance-id}
logging:
  structured:
    format:
      console: ecs
